"vi": "Anh Steven có phải là người Mỹ không? (Trang trọng)", "en": "Is Mr. Steven American? (Formal)"}, {"korean": "네, 저는 미국 사람입니다.", "vi": "Vâng, tôi là người Mỹ. (Trang trọng)", "en": "Yes, I am American. (Formal)"}, {"korean": "마이클 씨는 미국 사람입니까?", "vi": "Anh Michael có phải là người Mỹ không?", "en": "Is Mr. Michael American?"}, {"korean": "아니요, 저는 미국 사람이 아닙니다.", "vi": "Không, tôi không phải là người Mỹ.", "en": "No, I am not American."}, {"korean": "마이클 씨는 의사가 아닙니다.", "vi": "Anh Michael không phải là bác sĩ.", "en": "Mr. Michael is not a doctor."}, {"korean": "직업은 무엇입니까?", "vi": "Nghề nghiệp của bạn là gì? (Trang trọng)", "en": "What is your occupation? (Formal)"}, {"korean": "기자입니다.", "vi": "Tôi là phóng viên / nhà báo.", "en": "I am a reporter / journalist."}, {"korean": "선생님은 한국 사람이에요.", "vi": "Cô giáo là người Hàn Quốc.", "en": "The teacher is Korean."}, {"korean": "니콜 씨는 영어 선생님입니다.", "vi": "Cô Nicole là giáo viên tiếng Anh.", "en": "Ms. Nicole is an English teacher."}, {"korean": "아키라 씨는 일본 사람이에요.", "vi": "Anh Akira là người Nhật Bản.", "en": "Mr. Akira is Japanese."}, {"korean": "마리아 씨는 독일 사람이에요. 의사예요.", "vi": "Cô Maria là người Đức. Là bác sĩ.", "en": "Ms. Maria is German. She is a doctor."}, {"korean": "줄리앙 씨는 프랑스 사람이에요. 학생이에요.", "vi": "Anh Julien là người Pháp. Là sinh viên.", "en": "Mr. Julien is French. He is a student."}, {"korean": "제 명함입니다.", "vi": "Đây là danh thiếp của tôi.", "en": "Here is my business card."}, {"korean": "여러분, 만나서 반갑습니다.", "vi": "Chào mọi người, rất hân hạnh được gặp các bạn.", "en": "Everyone, pleased to meet you."}], "situations": "Lần đầu gặp bạn tại nhà khách (Guest House) | 안녕하세요? 저는 나나예요. 만나서 반가워요.\nĐối phương đáp lại và hỏi quốc tịch | 반가워요, 나나 씨. 나나 씨는 어느 나라 사람이에요?\nGiới thiệu quốc tịch của mình | 저는 베트남 사람이에요. 마이클 씨는 미국 사람이에요?\nĐối phương phủ định và đính chính quốc tịch | 아니요, 저는 미국 사람이 아닙니다. 영국 사람입니다.\nHỏi nghề nghiệp trong bối cảnh trang trọng | 직업은 무엇입니까?\nTrả lời nghề nghiệp | 저는 학생입니다. 마이클 씨는 기자입니까?", "examples": "안녕하세요? 저는 유진이에요.\n스티븐은 미국 사람이에요. 학생이에요.\n나나 씨는 어느 나라 사람이에요? - 저는 중국 사람이에요.\n스티븐 씨는 미국 사람입니까? - 네, 저는 미국 사람입니다.\n마이클 씨는 미국 사람입니까? - 아니요, 저는 미국 사람이 아닙니다. 영국 사람입니다.\n직업은 무엇입니까? - 기자입니다.\n여러분, 만나서 반갑습니다. 저는 최정우입니다.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 1: 안녕하세요?)\n\n1. 어휘 (Từ vựng):\n- Quốc gia & Quốc tịch: 한국 (Hàn), 베트남 (Việt), 미국 (Mỹ), 일본 (Nhật), 중국 (Trung), 영국 (Anh), 독일 (Đức), 프랑스 (Pháp), 호주 (Úc), 캐나다 (Canada), 러시아 (Nga), 인도 (Ấn Độ).\n- Công thức quốc tịch: Tên nước + 사람 (Lưu ý luôn có dấu cách: 한국 사람, 베트남 사람).\n- Nghề nghiệp: 선생님 (giáo viên), 학생 (học sinh/sinh viên), 회사원 (nhân viên công ty), 의사 (bác sĩ), 기자 (phóng viên), 가수 (ca sĩ), 군인 (quân nhân), 요리사 (đầu bếp), 주부 (nội trợ), 영어 선생님 (giáo viên tiếng Anh).\n\n2. 문법 (Ngữ pháp cốt lõi):\n- N은/는 N이에요/예요 (Thân mật đời thường): Có patchim + 은 / 이에요; Không patchim + 는 / 예요.\n- N입니까?, N입니다 (Trang trọng nghi thức): Gắn trực tiếp vào danh từ, không phân biệt patchim.\n- N이/가 아닙니다 (Phủ định trang trọng): Có patchim + 이 아닙니다; Không patchim + 가 아닙니다.\n\n3. 발음 (Phát âm chuẩn SNU):\n- Biến âm ㅂ gặp ㄴ: 입니다 [임니다], 입니까 [임니까], 반갑습니다 [반갑씀니다].\n- Ngữ điệu: Câu trần thuật hạ giọng ở cuối câu ↘, câu hỏi lên giọng ở từ cuối ↗."}, {"title": "Bài 2: Chỉ định từ và Đồ vật xung quanh (이거는 뭐예요?)", "id": "b1a_l2", "items": [{"korean": "책상", "vi": "Bàn học, bàn làm việc", "en": "Desk"}, {"korean": "의자", "vi": "Ghế ngồi", "en": "Chair"}, {"korean": "책", "vi": "Sách (chữ Hán: 冊)", "en": "Book"}, {"korean": "공책", "vi": "Vở ghi chép, tập viết", "en": "Notebook"}, {"korean": "볼펜", "vi": "Bút bi (ballpoint pen)", "en": "Ballpoint pen"}, {"korean": "연필", "vi": "Bút chì (chữ Hán: 鉛筆)", "en": "Pencil"}, {"korean": "지우개", "vi": "Cục tẩy, cục gôm", "en": "Eraser"}, {"korean": "필통", "vi": "Hộp bút, bóp đựng bút (chữ Hán: 筆筒)", "en": "Pencil case"}, {"korean": "가방", "vi": "Cặp sách, ba lô, túi xách", "en": "Bag / Backpack"}, {"korean": "시계", "vi": "Đồng hồ (chữ Hán: 時計, phát âm [시게])", "en": "Clock / Watch"}, {"korean": "모자", "vi": "Mũ, nón (chữ Hán: 帽子)", "en": "Hat / Cap"}, {"korean": "우산", "vi": "Cây dù, cái ô (chữ Hán: 雨傘)", "en": "Umbrella"}, {"korean": "신문", "vi": "Tờ báo, báo chí (chữ Hán: 新聞)", "en": "Newspaper"}, {"korean": "카메라", "vi": "Máy ảnh, máy chụp hình (camera)", "en": "Camera"}, {"korean": "사전", "vi": "Từ điển (chữ Hán: 辭典)", "en": "Dictionary"}, {"korean": "전자사전", "vi": "Từ điển điện tử (chữ Hán: 電子辭典)", "en": "Electronic dictionary"}, {"korean": "안경", "vi": "Kính mắt, cặp kính (chữ Hán: 眼鏡)", "en": "Glasses"}, {"korean": "휴대폰", "vi": "Điện thoại di động (chữ Hán/Anh: 携帶phone)", "en": "Mobile phone"}, {"korean": "창문", "vi": "Cửa sổ (chữ Hán: 窓門)", "en": "Window"}, {"korean": "지도", "vi": "Bản đồ (chữ Hán: 地圖)", "en": "Map"}, {"korean": "지갑", "vi": "Ví tiền, bóp tiền (chữ Hán: 紙匣)", "en": "Wallet"}, {"korean": "침대", "vi": "Giường ngủ (chữ Hán: 寢臺)", "en": "Bed"}, {"korean": "냉장고", "vi": "Tủ lạnh (chữ Hán: 冷藏庫)", "en": "Refrigerator"}, {"korean": "이거", "vi": "Cái này (đồ vật ở gần người nói)", "en": "This / This item"}, {"korean": "그거", "vi": "Cái đó (đồ vật gần người nghe hoặc vừa nhắc đến)", "en": "That / That item"}, {"korean": "저거", "vi": "Cái kia (đồ vật ở xa cả người nói và người nghe)", "en": "That over there"}, {"korean": "무엇 (뭐)", "vi": "Cái gì, cái nào (từ để hỏi)", "en": "What"}, {"korean": "주세요", "vi": "Xin hãy cho tôi..., vui lòng cho tôi...", "en": "Please give me"}], "examples": "이거는 책상이에요.\n그거는 의자예요.\n저거는 한국 지도예요.\n이거는 한국어로 뭐예요? - 필통이에요.\n저거는 텔레비전이에요? - 아니요, 컴퓨터예요.\n전자사전 있어요? - 네, 있어요.\n동전이 있어요? - 아니요, 없어요. 지갑만 있어요.\n한국신문하고 미국 잡지가 있어요.\n볼펜하고 공책 주세요.\n지우개 좀 주세요. - 여기 있어요.\n제 방에 침대와 책상이 있어요.\n텔레비전과 냉장고는 없어요.\n정우는 여자 친구가 없어요.", "situations": "Hỏi tên đồ vật ở gần mình | 이거는 뭐예요? - 한국어 책이에요.\nHỏi tên đồ vật ở gần người nghe | 그거는 한국어로 뭐예요? - 시계예요.\nHỏi tên đồ vật ở đằng xa | 저거는 뭐예요? - 지도예요.\nHỏi xác nhận đồ vật | 저거는 연필이에요? - 아니요, 볼펜이에요.\nHỏi người bán hàng có món đồ nào không | 한국어 사전 있어요? - 네, 있어요.\nHỏi loại từ điển cụ thể | 전자사전이에요? - 네, 전자사전이에요.\nYêu cầu lấy món hàng muốn mua | 그럼 그거 주세요.\nHỏi mua thêm báo chí, tạp chí | 신문 있어요? - 네, 한국신문하고 나라신문이 있어요.\nYêu cầu lấy tờ báo cụ thể | 한국신문 주세요. - 여기 있어요.\nKiểm tra đồ dùng cá nhân | 우산이 있어요? - 아니요, 우산이 없어요.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 2: 이거는 뭐예요?)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Đồ dùng học tập (학용품): 책상 (bàn học), 의자 (ghế), 책 (sách), 공책 (vở), 볼펜 (bút bi), 연필 (bút chì), 지우개 (cục tẩy), 필통 (hộp bút), 가방 (cặp/ba lô), 사전 (từ điển), 전자사전 (từ điển điện tử), 자 (thước kẻ).\n- Đồ dùng sinh hoạt cá nhân (일상 생활용품): 시계 [시게] (đồng hồ), 모자 (mũ), 우산 (cây dù), 신문 (báo), 잡지 (tạp chí), 카메라 (máy ảnh), 안경 (kính mắt), 휴대폰 (điện thoại), 지갑 (ví tiền), 창문 (cửa sổ), 지도 (bản đồ), 침대 (giường), 냉장고 (tủ lạnh), 컴퓨터 (máy tính), 텔레비전 (ti vi).\n- Đại từ chỉ định (지시대명사):\n  * 이거 (dạng đầy đủ 이것): Cái này - vật gần người nói.\n  * 그거 (dạng đầy đủ 그것): Cái đó - vật gần người nghe, hoặc vật vừa được nhắc đến trong hội thoại.\n  * 저거 (dạng đầy đủ 저것): Cái kia - vật ở xa cả người nói và người nghe.\n- Từ nghi vấn & Cụm từ: 무엇 / 뭐 (cái gì), 한국어로 (bằng tiếng Hàn), 어서 오세요 (xin mời vào), 여기 있어요 (ở đây ạ), 주세요 (xin hãy cho tôi).\n\n2. 문법 (Ngữ pháp trọng tâm):\n- N이/가 있어요[없어요]: Biểu thị sự sở hữu (\"có / không có N\").\n  * Danh từ có 받침 + 이 있어요 / 없어요 (우산이 있어요, 동전이 없어요).\n  * Danh từ không có 받침 + 가 있어요 / 없어요 (남자 친구가 있어요, 시계가 없어요).\n  * Trong khẩu ngữ tự nhiên, tiểu từ 이/가 thường được lược bỏ (우산 있어요?, 돈 없어요).\n- 이거는 [그거는, 저거는] N이에요/예요: Xác định danh tính đồ vật.\n  * N có 받침 + 이에요 (책상이에요, 사전이에요).\n  * N không có 받침 + 예요 (모자예요, 의자예요, 시계예요).\n  * Khẩu ngữ có thể lược 는: \"이거 뭐예요?\", \"저거 연필이에요?\".\n- N 주세요: Yêu cầu, đề nghị lịch sự (\"Xin hãy cho tôi N\"). Thêm '좀' để tăng độ mềm mỏng, lịch sự: \"지우개 좀 주세요.\"\n- N하고 N / N과/와 N: Liên từ nối danh từ (\"và, với\").\n  * 하고: Dùng phổ biến trong văn nói thân mật, không phân biệt 받침 (책하고 볼펜).\n  * 과/와: Dùng trang trọng hơn trong cả văn viết và văn nói (받침 O + 과: 책과 공책; 받침 X + 와: 지우개와 연필).\n  * Lưu ý: Không dùng 하고 để nối 2 mệnh đề riêng biệt (thay bằng 그리고).\n\n3. 발음 (Phát âm chuẩn):\n- Quy tắc phát âm nguyên âm '예': Khi kết hợp với phụ âm 'ㄱ, ㅍ, ㅎ', âm '예' thường được phát âm thành [게, 페, 헤]:\n  * 시계 -> [시게]\n  * 폐 -> [페]\n  * 지혜 -> [지헤]\n- Từ 계란 (trứng gà) cũng phát âm là [게란].\n\n4. 문화 산책 (Văn hóa Hàn Quốc):\n- Những vật dụng truyền thống độc đáo chỉ có tại Hàn Quốc:\n  * 효자손 (Tay con hiếu thảo): Cây gãi lưng bằng gỗ hoặc tre, thể hiện sự chăm sóc chu đáo của người con đối với cha mẹ lớn tuổi khi lưng ngứa khó với tới.\n  * 소반 (Bàn nhỏ Soban): Chiếc bàn ăn chân thấp bằng gỗ truyền thống nhỏ gọn, vừa vặn bưng cả mâm cơm từ bếp vào phòng có hệ thống sưởi sàn Ondol.\n  * 죽부인 (Trúc phu nhân): Gối ôm đan bằng nan tre rỗng bên trong, giúp không khí lưu thông thoáng mát, ôm ngủ ngon trong những đêm hè nóng ẩm oi bức.", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 3: Hoạt động thường nhật và Sinh hoạt (한국어를 공부해요)", "id": "b1a_l3", "items": [{"korean": "공부하다", "vi": "Học, học tập", "en": "To study"}, {"korean": "일하다", "vi": "Làm việc, lao động", "en": "To work"}, {"korean": "운동하다", "vi": "Tập thể dục, vận động thể thao", "en": "To exercise / work out"}, {"korean": "자다", "vi": "Ngủ", "en": "To sleep"}, {"korean": "먹다", "vi": "Ăn (phát âm [먹따])", "en": "To eat"}, {"korean": "마시다", "vi": "Uống", "en": "To drink"}, {"korean": "읽다", "vi": "Đọc (phát âm [익따], chia đuôi [일거요])", "en": "To read"}, {"korean": "보다", "vi": "Xem, nhìn, ngắm", "en": "To see / watch"}, {"korean": "만나다", "vi": "Gặp gỡ, tao ngộ", "en": "To meet"}, {"korean": "사다", "vi": "Mua sắm", "en": "To buy"}, {"korean": "배우다", "vi": "Học hỏi, tiếp thu kỹ năng", "en": "To learn"}, {"korean": "가르치다", "vi": "Dạy, giảng dạy, hướng dẫn", "en": "To teach"}, {"korean": "숙제", "vi": "Bài tập về nhà (숙제를 하다: làm bài tập)", "en": "Homework"}, {"korean": "아르바이트", "vi": "Việc làm thêm, làm bán thời gian", "en": "Part-time job"}, {"korean": "도서관", "vi": "Thư viện", "en": "Library"}, {"korean": "집", "vi": "Nhà, tổ ấm (phát âm [집])", "en": "Home / House"}, {"korean": "백화점", "vi": "Trung tâm thương mại, bách hóa (phát âm [배콰점])", "en": "Department store"}, {"korean": "시장", "vi": "Chợ, khu chợ", "en": "Market"}, {"korean": "공원", "vi": "Công viên", "en": "Park"}, {"korean": "커피숍", "vi": "Quán cà phê, tiệm trà", "en": "Coffee shop / Cafe"}, {"korean": "극장", "vi": "Rạp chiếu phim, rạp hát (phát âm [극짱])", "en": "Theater / Cinema"}, {"korean": "학교", "vi": "Trường học (phát âm [학꾜])", "en": "School"}, {"korean": "식당", "vi": "Quán ăn, nhà hàng, nhà ăn (phát âm [식땅])", "en": "Restaurant / Cafeteria"}, {"korean": "회사", "vi": "Công ty, văn phòng", "en": "Company / Office"}, {"korean": "노래방", "vi": "Quán karaoke (văn hóa phòng của Hàn Quốc)", "en": "Karaoke room"}, {"korean": "PC방", "vi": "Quán internet, phòng game công nghệ cao", "en": "Internet cafe / PC bang"}, {"korean": "지금", "vi": "Bây giờ, lúc này, hiện tại", "en": "Now / Right now"}, {"korean": "오늘", "vi": "Hôm nay", "en": "Today"}], "examples": "스티븐 씨, 지금 뭐 해요? - 공부해요. 마리코 씨는 뭐 해요?\n저는 책을 읽어요. - 한국어 책을 읽어요? - 아니요, 일본어 책을 읽어요.\n도서관에서 공부해요? - 아니요, 도서관에서 공부 안 해요. 집에서 공부해요.\n나나 씨, 오늘 뭐 해요? - 친구를 만나요.\n아키라 씨, 지금 일해요? - 아니요, 일 안 해요. 공원에서 운동해요.\n유진 씨, 집에서 뭐 해요? - 텔레비전을 봐요.\n마리코 씨는 커피숍에서 커피를 마셔요.\n줄리앙 씨는 식당에서 밥을 먹어요.\n줄리앙 씨는 학생 집에서 프랑스어를 가르쳐요.\n지금 언어교육원에서 한국어를 배워요.\n저는 오늘 학생 식당에서 밥을 먹어요.\n스티븐 씨는 오늘 정우 씨를 만나요. 서울식당에서 불고기를 먹어요.", "situations": "Hỏi đối phương đang làm gì | 스티븐 씨, 지금 뭐 해요? - 공부해요.\nHỏi đang đọc loại sách nào | 한국어 책을 읽어요? - 아니요, 일본어 책을 읽어요.\nHỏi địa điểm đang học bài | 도서관에서 공부해요? - 아니요, 집에서 공부해요.\nHỏi kế hoạch làm việc hôm nay | 오늘 일해요? - 아니요, 일 안 해요. 운동해요.\nHỏi hoạt động tại quán cà phê | 커피숍에서 뭐 해요? - 커피를 마셔요. 그리고 책을 읽어요.\nHỏi về công việc làm thêm | 어디에서 아르바이트해요? - 학생 집에서 프랑스어를 가르쳐요.\nRủ rê ăn trưa cùng nhau | 어디에서 밥을 먹어요? - 서울식당에서 불고기를 먹어요.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 3: 한국어를 공부해요)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Động từ thường nhật (동사 1): 자다 (ngủ), 공부하다 (học), 일하다 (làm việc), 운동하다 (tập thể dục), 숙제를 하다 (làm bài tập), 옷을 사다 (mua quần áo), 영화를 보다 (xem phim), 친구를 만나다 (gặp bạn), 태권도를 배우다 (học Taekwondo), 밥을 먹다 (ăn cơm), 커피를 마시다 (uống cà phê), 책을 읽다 (đọc sách), 가르치다 (dạy), 아르바이트하다 (làm thêm).\n- Địa điểm (장소 1): 도서관 (thư viện), 집 (nhà), 백화점 [배콰점] (TTTM), 시장 (chợ), 공원 (công viên), 커피숍 (quán cà phê), 극장 [극짱] (rạp phim), 학교 [학꾜] (trường học), 식당 [식땅] (quán ăn), 회사 (công ty), 언어교육원 (Viện Ngôn ngữ LEI).\n- Văn hóa phòng (방 문화): 노래방 (karaoke), PC방 (quán net), 찜질방 (xông hơi), 빨래방 (tiệm giặt sấy), 책방 (tiệm sách/truyện).\n\n2. 문법 (Ngữ pháp trọng tâm):\n- V-아요/어요: Đuôi kết thúc câu thân mật lịch sự hiện tại (해요체).\n  * Gốc ㅏ, ㅗ -> -아요 (만나요, 봐요, 자요, 사요).\n  * Đuôi 하다 -> -해요 (공부해요, 일해요, 운동해요).\n  * Gốc khác (ㅓ, ㅜ, ㅣ...) -> -어요 (먹어요, 마셔요, 읽어요, 배워요).\n  * Dùng cho hiện tại, thói quen và cả tương lai gần (내일 일해요).\n- N을/를: Tiểu từ tân ngữ trực tiếp (받침 O: 을, 받침 X: 를). Khẩu ngữ thường lược bỏ.\n- N에서: Địa điểm diễn ra hành động (N에서 V). Phân biệt với N에 (vị trí tĩnh 있다/없다 hoặc đích đến 가다/오다).\n- 안 V: Phủ định ngắn (\"không...\"). Chú ý động từ ghép [N + 하다] -> chèn 안 ở giữa: 공부 안 해요, 운동 안 해요, 일 안 해요 (tránh 안 공부해요).\n\n3. 발음 (Phát âm - 연음 법칙):\n- Quy tắc nối âm: Phụ âm cuối (받침) gặp nguyên âm (ㅇ) thì chuyển lên làm âm đầu của âm tiết sau:\n  * 독일 [도길], 밥을 [바블], 우산이 [우사니], 읽어요 [일거요], 집에서 [지베서], 책을 읽어요 [채글 일거요].\n\n4. 문화 (Văn hóa):\n- Văn hóa \"Bang\" (방 문화) độc đáo của Hàn Quốc: Các không gian dịch vụ khép kín, tiện lợi cho cá nhân và nhóm bạn thư giãn, học tập, giải trí (노래방, PC방, 찜질방, 빨래방, 만화카페).", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 4: Vị trí và Nơi chốn (어디에 있어요?)", "id": "b1a_l4", "items": [{"korean": "공항", "vi": "Sân bay, phi trường", "en": "Airport"}, {"korean": "우체국", "vi": "Bưu điện", "en": "Post office"}, {"korean": "대사관", "vi": "Đại sứ quán", "en": "Embassy"}, {"korean": "은행", "vi": "Ngân hàng", "en": "Bank"}, {"korean": "가게", "vi": "Cửa hàng, tiệm tạp hóa", "en": "Store / Shop"}, {"korean" .\n냉장고 안에 맥주가 있어요? - 아니요, 없어요.\n저는 지금 제 방에 있어요. 제 방은 기숙사에 있어요.\n책상 위에는 어머니하고 아버지 사진이 있어요.", "situations": "Hỏi nơi đang đứng là ở đâu | 여기가 어디예요? - 인사동이에요.\nHỏi một địa điểm cụ thể ở đâu | 우체국이 어디에 있어요?\nTrả lời vị trí tương đối của tòa nhà | 한국은행 앞에 있어요.\nHỏi bạn đang đi đâu | 어디에 가요? - 공항에 가요.\nGiải thích lý do đi sân bay đón bạn bè | 친구가 한국에 와요.\nHỏi tìm đồ đạc trong phòng | 여보! 우산이 어디에 있어요?\nTrả lời vị trí của đồ vật trong nhà | 창문 아래에 있어요. / 책상 위에 있어요.\nGiới thiệu về phòng ký túc xá | 제 방에는 침대하고 책상이 있어요.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 4: 어디에 있어요?)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Địa điểm công cộng (장소): 공항 (sân bay), 우체국 (bưu điện), 대사관 (đại sứ quán), 은행 (ngân hàng), 가게 (tiệm tạp hóa), 약국 [약꾹] (hiệu thuốc), 병원 (bệnh viện), 미용실 (tiệm tóc), 서점 (hiệu sách), 빵집 [빵찝] (tiệm bánh), 극장 [극짱] (rạp phim), 백화점 (TTTM), 기숙사 (KTX), 찻집 [찯찝] (quán trà), 식당 [식땅] (nhà ăn).\n- Vị trí & Phương hướng (위치와 방향): 앞 (trước), 뒤 (sau), 옆 (bên cạnh), 안 (trong), 밖 (ngoài), 위 (trên), 아래/밑 (dưới), 사이 (ở giữa), 오른쪽 (bên phải), 왼쪽 (bên trái).\n- Đại từ chỉ nơi chốn: 여기 (đây - gần người nói), 저기 (kia - xa cả hai), 거기 (đó - gần người nghe/đã nhắc trước), 어디 (ở đâu).\n\n2. 문법 (Ngữ pháp trọng tâm):\n- 여기가 N이에요/예요: Xác định địa điểm hiện tại (받침 O: 이에요, 받침 X: 예요).\n- N에 있어요[없어요]: Biểu thị vị trí/tồn tại của người hoặc vật. Nhấn mạnh: N에는.\n  * Phân biệt: N에 있다/없다 (tồn tại tĩnh) vs N에서 V (địa điểm diễn ra hành động động).\n- N에 가요[와요]: Điểm đến của di chuyển (가다: đi xa vị trí nói, 오다: đến gần vị trí nói).\n- [Vật chuẩn] + [Từ vị trí] + 에 있어요: Định vị không gian tương đối (은행 앞에, 병원 뒤에, 책상 위에).\n\n3. 발음 (Phát âm - 경음화 1):\n- Patchim [ㄱ] gặp ㄱ, ㄷ, ㅂ, ㅅ, ㅈ -> hóa âm căng [ㄲ, ㄸ, ㅃ, ㅆ, ㅉ]:\n  * 약국 [약꾹], 식당 [식땅], 책방 [책빵], 학생 [학쌩], 극장 [극짱], 학교 [학꾜], 숙제 [숙째].\n\n4. 문화 (Văn hóa):\n- Phố cổ Insadong (인사동): Uống trà truyền thống (차를 마셔요 / 찻집), ăn món ăn truyền thống (한국 음식), mua đồ lưu niệm mỹ nghệ (기념품을 사요), ngắm tranh triển lãm (그림 구경).", "studied": false, "level": 0, s"}, {"korean": "언제", "vi": "Khi nào, bao giờ (từ để hỏi thời gian)", "en": "When"}, {"korean": "약속", "vi": "Cuộc hẹn, lời hẹn, kế hoạch", "en": "Appointment / plan"}], "examples": "오늘이 며칠이에요? - 유월 팔 일이에요.\n9일이 무슨 요일이에요? - 금요일이에요.\n금요일에 약속이 있어요. 친구하고 같이 영화를 봐요.\n주말에 뭐 했어요? - 친구를 만나고 쇼핑했어요.\n어제 식당에서 한국 음식을 먹었어요.\n내일은 아키라 씨 생일이에요. 그래서 백화점에서 모자를 샀어요.\n밥을 먹고 커피를 마셨어요.", "situations": "Hỏi hôm nay là ngày mấy tháng mấy | 오늘이 몇 월 며칠이에요?\nTrả lời ngày và thứ trong tuần | 오늘은 5월 9일 금요일이에요.\nHỏi thời gian rảnh để mời tiệc | 금요일에 시간이 있어요?\nTừ chối khéo léo vì đã có hẹn | 미안해요. 금요일에는 약속이 있어요.\nHỏi bạn đã làm gì vào cuối tuần | 주말에 뭐 했어요?\nKể chuỗi hoạt động quá khứ bằng -고 | 친구하고 영화를 보고 쇼핑했어요.\nKể lại việc nghỉ ngơi ở nhà | 저는 집에서 쉬었어요.\nHỏi sinh nhật của bạn | 생일이 언제예요? - 10월 23일이에요.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 5: 주말에 친구를 만났어요)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Thứ trong tuần (요일): 월요일, 화요일, 수요일, 목요일, 금요일, 토요일, 일요일. Cuối tuần: 주말. Ngày thường: 평일.\n- Số Hán-Hàn (1–10): 일, 이, 삼, 사, 오, 육, 칠, 팔, 구, 십. Dùng cho: ngày (일), tháng (월), năm (년), phút (분), tiền (원).\n- Biến âm tháng đặc biệt: Tháng 6 đọc là 유월 (bỏ patchim ㄱ), Tháng 10 đọc là 시월 (bỏ patchim ㅂ).\n\n2. 문법 (Ngữ pháp cốt lõi):\n- 날짜와 요일: Hôm nay ngày mấy: 오늘이 며칠이에요? Thứ mấy: 무슨 요일이에요?\n- N에 (Trợ từ thời gian): Gắn sau thời gian xảy ra hành động (토요일에, 3시에). Lưu ý ngoại lệ: 어제, 오늘, 내일, 지금, 언제 KHÔNG dùng với '에'.\n- V/A-았/었-: Đuôi thì quá khứ. Thân từ có ㅏ, ㅗ + -았어요 (갔어요, 봤어요); Thân từ khác + -었어요 (먹었어요, 마셨어요); 하다 -> 했어요 (공부했어요).\n- V-고: Nối hai hành động theo trình tự thời gian hoặc song song. Thì quá khứ chỉ chia ở động từ cuối câu (숙제하고 텔레비전을 봤어요).\n\n3. 발음 (Quy tắc phát âm số 십):\n- Sau patchim [ㅂ] của 십: 십삼 [십쌈], 십구 [십꾸] (Căng âm hóa).\n- Đi với số 6 (육): 십육 [심뉵], 이십육 [이심뉵] (Chèn âm ㄴ và biến âm mũi).\n- Nối âm trước nguyên âm: 십일 [시빌], 십이 [시비].", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 6: Ngôn ngữ thương mại cơ bản & Mua sắm (쇼핑)", "id": "b1a_l6", "items": [{"korean": "비빔밥", "vi": "Cơm trộn Hàn Quốc (Bibimbap)", "en": "Mixed rice with vegetables and meat"}, {"korean": "불고기", "vi": "Thịt bò xào tẩm sốt đậm đà (Bulgogi)", "en": "Marinated beef"}, {"korean": "갈비탕", "vi": "Canh sườn bò hầm ngọt thanh (Galbitang)", "en": "Short rib soup"}, {"korean": "김치찌개", "vi": "Canh kim chi cải thảo cay nồng", "en": "Kimchi stew"}, {"korean": "냉면", "vi": "Mì kiều mạch nước dùng lạnh (Naengmyeon)", "en": "Cold noodles"}, {"korean": "라면", "vi": "Mì tôm gói ăn liền Hàn Quốc (Ramyeon)", "en": "Instant noodles"}, {"korean": "김밥", "vi": "Cơm cuộn rong biển (Kimbap)", "en": "Seaweed rice roll"}, {"korean": "돈가스", "vi": "Cốt lết thịt heo tẩm bột chiên xù (Donkatsu)", "en": "Pork cutlet"}, {"korean": "사과", "vi": "Quả táo", "en": "Apple"}, {"korean": "오렌지", "vi": "Quả cam", "en": "Orange"}, {"korean": "딸기", "vi": "Quả dâu tây", "en": "Strawberry"}, {"korean": "수박", "vi": "Quả dưa hấu", "en": "Watermelon"}, {"korean": "하나 (한)", "vi": "Số 1 (Số thuần Hàn - biến thành 한 trước lượng từ)", "en": "One (native Korean)"}, {"korean": "둘 (두)", "vi": "Số 2 (Số thuần Hàn - biến thành 두 trước lượng từ)", "en": "Two (native Korean)"}, {"korean": "셋 (세)", "vi": "Số 3 (Số thuần Hàn - biến thành 세 trước lượng từ)", "en": "Three (native Korean)"}, {"korean": "넷 (네)", "vi": "Số 4 (Số thuần Hàn - biến thành 네 trước lượng từ)", "en": "Four (native Korean)"}, {"korean": "다섯", "vi": "Số 5 (Số thuần Hàn)", "en": "Five (native Korean)"}, {"korean": "여섯", "vi": "Số 6 (Số thuần Hàn)", "en": "Six (native Korean)"}, {"korean": "일곱", "vi": "Số 7 (Số thuần Hàn)", "en": "Seven (native Korean)"}, {"korean": "여덟", "vi": "Số 8 (Số thuần Hàn [여덜])", "en": "Eight (native Korean)"}, {"korean": "아홉", "vi": "Số 9 (Số thuần Hàn)", "en": "Nine (native Korean)"}, {"korean": "열", "vi": "Số 10 (Số thuần Hàn)", "en": "Ten (native Korean)"}, {"korean": "개", "vi": "Cái, quả, chiếc (Lượng từ đồ vật, hoa quả)", "en": "Item counter (general)"}, {"korean": "병", "vi": "Chai, bình (Lượng từ đồ uống đóng chai)", "en": "Bottle counter"}, {"korean": "잔", "vi": "Ly, cốc, tách (Lượng từ đồ uống rót ly)", "en": "Cup / glass counter"}, {"korean": "그릇", "vi": "Bát, tô (Lượng từ món ăn dọn theo tô)", "en": "Bowl counter"}, {"korean": "얼마", "vi": "Bao nhiêu (hỏi giá tiền)", "en": "How much"}, {"korean": "원", "vi": "Đồng Won (đơn vị tiền tệ Hàn Quốc)", "en": "Won (currency unit)"}], "examples": "여기 앉으세요. 메뉴 좀 주세요.\n비빔밥 한 그릇하고 갈비탕 한 그릇 주세요.\n이 사과는 얼마예요? - 세 개에 이천 원이에요.\n오렌지 여섯 개 주세요. 사과도 세 개 주세요.\n냉장고에 맥주 두 병하고 콜라 세 캔이 있어요.\n한국 음식이 아주 맛있어요.\n책이 아주 깨끗해요. 한 권에 이천 원이에요.", "situations": "Chào đón khách và mời ngồi | 어서 오세요. 여기 앉으세요.\nĐề nghị xem thực đơn lịch sự | 메뉴 좀 주세요.\nGọi món ăn và đồ uống tại quán | 비빔밥 한 그릇하고 콜라 두 병 주세요.\nYêu cầu khách vui lòng chờ một lát | 네, 잠깐만 기다리세요.\nHỏi giá trái cây ở chợ | 아저씨, 이 사과 얼마예요?\nTrả lời giá tiền theo số lượng | 세 개에 이천 원이에요.\nMua thêm món khác với trợ từ '도' | 오렌지 여섯 개 주세요. 사과도 세 개 주세요.\nXin giảm giá khéo léo | 너무 비싸요. 좀 깎아 주세요.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 6: 얼마예요?)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Món ăn & Đồ uống: 비빔밥, 불고기, 갈비탕, 김치찌개, 냉면, 라면, 김밥, 돈가스, 커피, 콜라, 사이다, 맥주.\n- Số thuần Hàn (1–10): 하나, 둘, 셋, 넷, 다섯, 여섯, 일곱, 여덟, 아홉, 열. (Khi gắn danh từ đếm: 하나 -> 한, 둘 -> 두, 셋 -> 세, 넷 -> 네).\n- Danh từ chỉ đơn vị đếm: 개 (cái/quả), 병 (chai), 잔 (ly/tách), 그릇 (bát/tô), 권 (cuốn/quyển), 명 (người).\n- Tiền tệ: 원 (won), 십, 백, 천, 만. Cụm hỏi giá: ~ 얼마예요? / ~에 얼마예요?\n\n2. 문법 (Ngữ pháp cốt lõi):\n- V-(으)세요: Yêu cầu, mệnh lệnh lịch sự trong giao tiếp thân mật. Không patchim hoặc patchim ㄹ (lược ㄹ) + -세요; Có patchim + -으세요. Thường đi kèm '좀' để tăng tính nhã nhặn.\n- Trật tự từ đếm: Danh từ + Số thuần Hàn + Lượng từ (VD: 비빔밥 한 그릇, 사과 세 개).\n- N이/가 A-아요/어요: Tính từ làm vị ngữ miêu tả đặc tính (맛있어요, 싸요, 커요).\n- N도: Trợ từ \"cũng\", thay thế hoàn toàn trợ từ chủ ngữ (은/는, 이/가) và tân ngữ (을/를).\n\n3. 발음 (Quy tắc phát âm - Giản lược 'ㅎ' 탈락):\n- Khi patchim 'ㅎ, ㄶ, ㅀ' gặp nguyên âm phía sau (ㅇ), âm [ㅎ] bị câm hoàn toàn:\n  * 좋아요 [조아요]\n  * 좋아해요 [조아해요]\n  * 많아요 [마나요]\n  * 싫어해요 [시러해요]", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 7: Quan sát và Miêu tả thời tiết (날씨)", "id": "b1a_l7", "items": [{"korean": "날씨", "vi": "Thời tiết", "en": "Weather"}, {"korean": "어떻습니까?", "vi": "Như thế nào ạ? (Kính ngữ trang trọng nghi thức)", "en": "How is it? (Formal polite)"}, {"korean": "사계절", "vi": "Bốn mùa, tứ quý (봄, 여름, 가을, 겨울)", "en": "Four seasons"}, {"korean": "봄", "vi": "Mùa xuân (ấm áp, trăm hoa đua nở)", "en": "Spring"}, {"korean": "여름", "vi": "Mùa hè (nóng bức, mùa mưa changma)", "en": "Summer"}, {"korean": "가을", "vi": "Mùa thu (mát mẻ, lá đỏ danpung)", "en": "Autumn / Fall"}, {"korean": "겨울", "vi": "Mùa đông (lạnh giá, có tuyết rơi)", "en": "Winter"}, {"korean": "따뜻하다", "vi": "Ấm áp (thời tiết, tính cách)", "en": "To be warm"}, {"korean": "덥다", "vi": "Nóng bức (bất quy tắc ㅂ -> 더워요)", "en": "To be hot (weather)"}, {"korean": "시원하다", "vi": "Mát mẻ, dễ chịu sảng khoái", "en": "To be cool, refreshing"}, {"korean": "춥다", "vi": "Lạnh rét (bất quy tắc ㅂ -> 추워요)", "en": "To be cold (weather)"}, {"korean": "맑다", "vi": "Trời trong xanh, quang đãng [막따]", "en": "To be clear, sunny"}, {"korean": "흐리다", "vi": "Âm u, trời nhiều mây u ám", "en": "To be cloudy, overcast"}, {"korean": "비가 오다", "vi": "Mưa rơi, trời mưa (비가 내려요)", "en": "To rain"}, {"korean": "눈이 오다", "vi": "Tuyết rơi (눈이 내려요)", "en": "To snow"}, {"korean": "바람이 불다", "vi": "Gió thổi mạnh", "en": "The wind blows"}, {"korean": "꽃이 피다", "vi": "Hoa nở", "en": "Flowers bloom"}, {"korean": "수영하다", "vi": "Bơi lội (đi biển mùa hè)", "en": "To swim"}, {"korean": "단풍이 들다", "vi": "Lá chuyển màu đỏ vàng mùa thu", "en": "Autumn leaves turn red/gold"}, {"korean": "스키를 타다", "vi": "Trượt tuyết (hoạt động mùa đông)", "en": "To ski"}, {"korean": "어렵다", "vi": "Khó (bất quy tắc ㅂ -> 어려워요)", "en": "To be difficult"}, {"korean": "쉽다", "vi": "Dễ dàng (bất quy tắc ㅂ -> 쉬워요)", "en": "To be easy"}, {"korean": "맵다", "vi": "Cay (bất quy tắc ㅂ -> 매워요)", "en": "To be spicy"}, {"korean": "무겁다", "vi": "Nặng (bất quy tắc ㅂ -> 무거워요)", "en": "To be heavy"}, {"korean": "가볍다", "vi": "Nhẹ (bất quy tắc ㅂ -> 가벼워요)", "en": "To be light (weight)"}, {"korean": "아주 / 정말", "vi": "Rất / thực sự", "en": "Very / really"}, {"korean": "조금", "vi": "Một chút, hơi hơi", "en": "A little, slightly"}, {"korean": "하지만", "vi": "Nhưng, tuy nhiên (liên từ đầu câu)", "en": "However, but"}], "examples": "오늘 날씨가 어떻습니까? - 날씨가 아주 좋습니다.\n서울의 여름은 덥지만 겨울은 춥습니다.\n가을은 시원하고 하늘이 맑습니다.\n비가 오지만 따뜻합니다.\n봄에는 꽃이 피고 따뜻합니다. 겨울에는 눈이 오고 춥습니다.\n한국어 공부가 어렵지만 재미있습니다.\n오늘 바람이 많이 불고 날씨가 흐립니다.", "situations": "Hỏi thăm thời tiết hôm nay | 오늘 날씨가 어떻습니까?\nMiêu tả trời lạnh và có tuyết rơi | 오늘은 춥고 눈이 옵니다.\nNhận xét về mùa hè Hàn Quốc | 한국의 여름은 아주 덥습니다.\nĐối chiếu hai mùa đối lập bằng -지만 | 여름은 덥지만 겨울은 춥습니다.\nMiêu tả khí hậu mùa thu dễ chịu | 가을은 날씨가 맑고 시원합니다.\nNhận định về thời tiết quê hương | 하노이의 겨울은 춥지 않고 따뜻합니다.\nHỏi món ăn có cay không | 김치가 맵습니까? - 조금 맵지만 맛있습니다.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 7: 날씨가 어떻습니까?)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Bốn mùa (사계절): 봄 (xuân - 꽃이 피다), 여름 (hè - 덥다, 수영하다), 가을 (thu - 시원하다, 단풍이 들다), 겨울 (đông - 춥다, 눈이 오다, 스키를 타다).\n- Thời tiết: 맑다 (quang đãng), 흐리다 (âm u), 비가 오다 (mưa), 눈이 오다 (tuyết), 바람이 불다 (gió thổi).\n- Tính từ bất quy tắc 'ㅂ': 덥다 (더워요), 춥다 (추워요), 어렵다 (어려워요), 쉽다 (쉬워요), 맵다 (매워요), 무겁다 (무거워요), 가볍다 (가벼워요). (Gặp nguyên âm: ㅂ biến thành 우).\n\n2. 문법 (Ngữ pháp cốt lõi):\n- A/V-습니다/ㅂ니다 & -습니까/ㅂ니까?: Đuôi câu kính ngữ trang trọng nghi thức. Không patchim hoặc patchim ㄹ (lược ㄹ) + -ㅂ니다/ㅂ니까; Có patchim + -습니다/습니까.\n- A/V-지만: Liên từ liên kết diễn tả quan hệ tương phản đối lập (\"nhưng\"). Gắn trực tiếp vào thân từ không đổi hình thức.\n- A/V-고: Liên từ liên kết nối hai hành động hoặc trạng thái song song (\"và\", \"còn\").\n\n3. 발음 (Quy tắc phát âm - 비음화 1 - Đồng hóa mũi):\n- Khi âm patchim [ㅂ/ㅍ] gặp phụ âm bắt đầu [ㄴ/ㅁ] ở âm tiết sau, patchim biến thành âm [ㅁ]:\n  * 춥다 + 습니다 -> 춥습니다 [춤씀니다]\n  * 입다 + 습니까 -> 입습니까 [임씀니까]\n  * 십 + 년 -> 십년 [심년]", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 8: Rủ rê, Hẹn hò và Hoạt động giải trí (영화 볼까요?)", "id": "b1a_l8", "items": [{"korean": "골프", "vi": "Môn gôn, chơi gôn (golf)", "en": "Golf"}, {"korean": "테니스", "vi": "Môn quần vợt, khúc côn cầu lưới (tennis)", "en": "Tennis"}, {"korean": "당구", "vi": "Môn bi-da, bida (chữ Hán: 撞球)", "en": "Billiards"}, {"korean": "피아노", "vi": "Đàn piano, dương cầm", "en": "Piano"}, {"korean": "기타", "vi": "Đàn ghi-ta, tây ban cầm", "en": "Guitar"}, {"korean": "자전거", "vi": "Xe đạp (chữ Hán: 自轉車)", "en": "Bicycle"}, {"korean": "스키", "vi": "Môn trượt tuyết, ván trượt tuyết (ski)", "en": "Ski"}, {"korean": "스케이트", "vi": "Môn trượt băng, giày trượt băng (skate)", "en": "Ice skate"}, {"korean": "농구", "vi": "Môn bóng rổ (chữ Hán: 籠球)", "en": "Basketball"}, {"korean": "축구", "vi": "Môn bóng đá (chữ Hán: 蹴球)", "en": "Football / Soccer"}, {"korean": "게임", "vi": "Trò chơi điện tử, game", "en": "Video game"}, {"korean": "낮잠", "vi": "Giấc ngủ trưa (낮잠을 자다: ngủ trưa)", "en": "Nap"}, {"korean": "산책", "vi": "Đi dạo, tản bộ (chữ Hán: 散策)", "en": "Walk / Stroll"}, {"korean": "등산", "vi": "Leo núi (chữ Hán: 登山)", "en": "Mountain hiking"}, {"korean": "치다", "vi": "Đánh, chơi (nhạc cụ có phím/dây hoặc thể thao dùng gậy/vợt)", "en": "To play / hit"}, {"korean": "타다", "vi": "Đi, cưỡi, trượt (xe cộ hoặc môn thể thao trượt)", "en": "To ride"}, {"korean": "걷다", "vi": "Đi bộ, dạo bước (bất quy tắc ㄷ: 걸어요)", "en": "To walk"}, {"korean": "듣다", "vi": "Nghe (nhạc, đài phát thanh; bất quy tắc ㄷ: 들어요)", "en": "To listen"}, {"korean": "심심하다", "vi": "Buồn chán (vì rảnh rỗi không có việc gì làm)", "en": "To be bored"}, {"korean": "시원하다", "vi": "Mát mẻ, sảng khoái (thời tiết, đồ uống, cảm giác)", "en": "To be cool / refreshing"}, {"korean": "가깝다", "vi": "Gần về khoảng cách (bất quy tắc ㅂ: 가까워요)", "en": "To be close / near"}, {"korean": "피곤하다", "vi": "Mệt mỏi, uể oải (chữ Hán: 疲困하다)", "en": "To be tired"}, {"korean": "자주", "vi": "Thường xuyên, hay làm việc gì đó", "en": "Often / Frequently"}, {"korean": "다음에", "vi": "Lần sau, dịp khác, sau này", "en": "Next time"}, {"korean": "또", "vi": "Lại, nữa, một lần nữa", "en": "Again / Also"}, {"korean": "정말", "vi": "Thật sự, quả thực (chữ Hán/thuần: 正말)", "en": "Really / Truly"}, {"korean": "한강", "vi": "Sông Hán (con sông biểu tượng tại Seoul, chữ Hán: 漢江)", "en": "Han River"}, {"korean": "식혜", "vi": "Nước gạo ngọt lên men truyền thống Hàn Quốc (chữ Hán: 食醯)", "en": "Sikhye (Sweet rice drink)"}], "examples": "우리 주말에 영화 볼까요? - 좋아요, 같이 영화 봐요.\n내일 몇 시에 만날까요? - 오후 두 시에 만나요.\n점심에 뭘 먹을까요? - 시원한 냉면을 먹어요.\n오늘 날씨가 좋으니까 한강공원에서 걸을까요? - 그래요, 걸어서 가요.\n한국어 공부는 재미있지만 주말에는 조금 심심해요.\n음악이 정말 좋네요. 무슨 노래 들어요?\n한국 노래를 들어요. 매일 아침 라디오를 들어요.\n이 가방이 예쁘네요. 그 가방 얼마예요?\n저 식당 음식이 정말 맛있네요.\n모자가 2,000원이에요? 와, 정말 싸네요!\n정우 씨는 운동을 자주 해요? - 네, 수요일과 금요일에 농구를 해요.\n주말에 친구하고 같이 기타도 치고 노래방에도 가요.\n날씨가 더우니까 시원한 식혜 마실까요?\n오늘은 피곤하니까 일찍 집에서 쉴까요?", "situations": "Rủ bạn cùng lên kế hoạch làm gì vào cuối tuần | 우리 이번 주말에 뭐 할까요?\nBày tỏ sự buồn chán vì rảnh rỗi không có việc làm | 한국어 공부는 재미있지만 주말에는 조금 심심해요.\nRủ bạn cùng đi đạp xe giải trí | 주말에 같이 자전거 탈까요? - 좋아요. 어디에서 탈까요?\nĐề xuất địa điểm và hỏi cách thức di chuyển | 한강에서 타요. 그런데 한강에 어떻게 가요?\nHướng dẫn đi bộ vì khoảng cách gần | 가까워요. 걸어서 가요.\nThốt lên cảm thán khi đón gió mát bên sông Hán | 와, 정말 시원하네요!\nHỏi thói quen thường xuyên đến công viên | 정우 씨는 이 공원에 자주 와요? - 네, 자주 와요.\nKhen ngợi trải nghiệm và rủ lần sau lại đến | 아주 재미있네요. 그럼 우리 다음에 또 올까요?\nTừ chối lịch sự lời mời và hẹn sang dịp khác | 미안해요. 이번 토요일에는 등산을 가요. 다음에 해요.\nRủ bạn đi nghe nhạc, hát karaoke vào cuối tuần | 그럼 이번 주말에 같이 노래방 갈까요? - 네, 좋아요.", "notes": "📚 Giáo trình chuẩn: Seoul National University Korean 1A (Bài 8: 영화 볼까요?)\n\n1. 어휘 (Từ vựng cốt lõi):\n- Hoạt động thể thao & giải trí kết hợp với động từ chuyên dụng:\n  * 치다 (đánh/chơi bằng vợt, gậy hoặc nhạc cụ phím/dây): 골프를 치다 (chơi gôn), 테니스를 치다 (chơi quần vợt), 당구를 치다 (chơi bi-da), 기타를 치다 (chơi đàn ghi-ta), 피아노를 치다 (chơi đàn piano).\n  * 타다 (cưỡi, trượt, đi phương tiện): 자전거를 타다 (đi xe đạp), 스키를 타다 (trượt tuyết), 스케이트를 타다 (trượt băng).\n  * 하다 (làm/chơi các môn thể thao tập thể, trí tuệ): 농구를 하다 (chơi bóng rổ), 축구를 하다 (chơi bóng đá), 게임을 하다 (chơi game), 등산을 하다 (leo núi), 산책을 하다 (đi dạo), 여행을 하다 (đi du lịch).\n  * 자다: 낮잠을 자다 (ngủ trưa).\n- Tính từ & Trạng từ: 심심하다 (buồn chán vì rảnh), 시원하다 (mát mẻ, sảng khoái), 가깝다 (gần), 피곤하다 (mệt mỏi), 자주 (thường xuyên), 다음에 (lần sau), 또 (lại, nữa), 정말 (thật sự).\n- Địa điểm & Đồ uống truyền thống: 한강 (sông Hán), 관악산 (núi Gwanak), 한강공원 (công viên sông Hán), 노래방 (phòng karaoke), 찜질방 (nhà tắm hơi, xông hơi truyền thống), 식혜 (nước gạo ngọt).\n\n2. 문법 (Ngữ pháp trọng tâm):\n- V-(으)ㄹ까요?: Rủ rê, đề xuất hoặc hỏi ý kiến người nghe về một kế hoạch chưa quyết định (\"Chúng ta cùng... nhé?\", \"Tôi làm... nhé?\").\n  * Thân động từ không có 받침 hoặc có 받침 'ㄹ' + -ㄹ까요? (가다 -> 갈까요?, 만들다 -> 만들까요?).\n  * Thân động từ có 받침 khác + -을까요? (먹다 -> 먹을까요?, 앉다 -> 앉을까요?).\n  * Trả lời đồng thuận thường dùng đuôi '-아요/어요' (청유: \"네, 같이 가요\", \"좋아요, 극장에 가요\") hoặc phong cách trang trọng '-(으)ㅂ시다' (\"비빔밥을 먹읍시다\" - lưu ý không dùng -(으)ㅂ시다 với người bề trên).\n- 'ㄷ' 불규칙 (Bất quy tắc phụ âm cuối 'ㄷ'):\n  * Khi gốc động từ kết thúc bằng 'ㄷ' gặp đuôi bắt đầu bằng nguyên âm (-아/어, -(으)ㄹ, -(으)시), 'ㄷ' biến đổi thành 'ㄹ'.\n  * 듣다 (nghe) -> 들어요, 들었어요, 들을까요?, 들으세요. (Trước phụ âm giữ nguyên: 듣고, 듣지만, 듣습니다).\n  * 걷다 (đi bộ) -> 걸어요, 걸었어요, 걸을까요?, 걸으세요. (Trước phụ âm: 걷고, 걷지만, 걷습니다).\n  * 묻다 (hỏi) -> 물어요, 물었어요, 물을까요?, 물으세요.\n  * Các động từ có quy tắc (không đổi): 닫다 (đóng -> 닫아요), 받다 (nhận -> 받아요), 믿다 (tin tưởng -> 믿어요).\n- 이, 그, 저 N (Định từ chỉ định bổ nghĩa trực tiếp cho danh từ đứng sau):\n  * 이 N: Cái/Người N này (gần người nói). Ví dụ: 이 공원, 이 사람, 이 가방.\n  * 그 N: Cái/Người N đó (gần người nghe hoặc đã được nhắc đến trước đó trong cuộc trò chuyện). Ví dụ: 그 가방, 그 영화.\n  * 저 N: Cái/Người N kia (ở xa cả người nói và người nghe). Ví dụ: 저 식당, 저 산.\n  * Phân biệt: '이거/그거/저거' là đại từ độc lập (thay thế cho danh từ), còn '이/그/저' là định từ đi liền trước danh từ.\n- A/V-네요: Đuôi kết thúc câu cảm thán biểu thị sự ngạc nhiên, cảm nhận trực tiếp khi nhận ra một điều mới mẻ (\"...quá nhỉ!\", \"...thế nhỉ!\").\n  * Gắn trực tiếp vào thân tính từ và động từ, không phụ thuộc vào 받침 (싸다 -> 싸네요, 덥다 -> 덥네요, 시원하다 -> 시원하네요, 오다 -> 오네요, 먹다 -> 먹네요).\n  * Chú ý hiện tượng mũi hóa khi phát âm: 맛있다 + 네요 -> [마신네요], 재미있다 + 네요 -> [재미인네요], 덥네요 -> [덤네요].\n\n3. 발음 (Phát âm chuẩn):\n- Ngữ điệu câu thỉnh dụ / đề nghị (청유문의 억양):\n  * Trong câu đề nghị, rủ rê (như \"같이 숙제해요\", \"극장에 가요\"), ngữ điệu cuối câu hơi nâng nhẹ lên rồi hạ xuống (↗↘).\n  * Khác với câu trần thuật thông thường ngữ điệu chỉ đi xuống (↘), và câu hỏi nghi vấn ngữ điệu nâng hẳn lên (↗).\n\n4. 문화 산책 (Văn hóa gặp gỡ & Hẹn hò của người Hàn Quốc):\n- 미팅 (Meeting): Buổi gặp gỡ làm quen tập thể giữa nhóm nam sinh và nữ sinh (thường là sinh viên đại học), chơi các trò chơi kết đôi vui nhộn.\n- 소개팅 (Sogaeting): Cuộc hẹn hò giấu mặt 1-1 được người quen, bạn bè giới thiệu, nhằm mục đích tìm hiểu và kết bạn lãng mạn.\n- 선 (Seon / 맞선): Buổi gặp mặt trang trọng giữa hai người do cha mẹ, người lớn tuổi hoặc mai mối sắp đặt, hướng thẳng tới mục tiêu hôn nhân nghiêm túc.", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}]}, {"id": "b1b", "name": "Quyển 1B — Sơ cấp 1 (Nửa sau)", "desc": "Bài 9–16", "lessons": [{"title": "Bài 9: Hệ thống giao thông và Hướng di chuyển (교통)", "id": "b1b_l1", "items": [], "examples": "", "situations": "", "notes": "", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 10: Văn hóa ẩm thực và Giao tiếp tại nhà hàng (음식)", "id": "b1b_l2", "items": [], "examples": "", "situations": "", "notes": "", "studied": false, "level": 0, "lastStudied": null, "nextReview": null}, {"title": "Bài 11: Cấu trúc gia đình và Kính ngữ cơ bản (가족)", "id": "b1b_l3", "items"
